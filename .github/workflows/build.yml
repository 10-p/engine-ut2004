name: build

# ufront 2.34 — CI for the engine build matrix.
#
# Scope, decided with the owner: build on EVERY push and pull request and upload the binaries as workflow
# artifacts. No GitHub Releases — the artifacts on the run page are the deliverable.
#
# What this does NOT do: run the game, and NOT build the web target.
#   * Running needs a GPU; a hosted runner has none (the monorepo's E2E is guarded by
#     tools/e2e-gpu-guard.mjs for exactly this reason). Rendering stays a human check on the owner's box.
#   * ⚠ The WEB link of THIS engine preloads `${UT_ASSETS_DIR}/System/Build.ini` — a file from the retail
#     asset tree, which is not in this repo and never will be. unreal1 and ut99 preload only tracked
#     config and so DO have a web job; ut2004 cannot until that preload is sourced from something
#     tracked. Not a workaround to invent under time pressure: the web artifact is built on the owner's
#     box, where the assets live.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    # ⚠ A CONTAINER, not the bare runner — the runner image preinstalls amd64 -dev packages that make
    # `libsdl2-dev:i386` uninstallable (libglib2.0-dev-bin is Multi-Arch: foreign, so apt ends in "held
    # broken packages"). A stock ubuntu:24.04 resolves multiarch normally.
    container: ubuntu:24.04
    # ⚠ A container job defaults to `sh -e`, not bash — GitHub only picks bash on the bare runner image.
    # dash has no `set -o pipefail`, so a step that opens with `set -euo pipefail` dies on line 1 with a
    # bare "exit code 2" and no message about the shell. Pin it.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # THE MATRIX IS THE OWNER'S SHIP LIST (2026-09-12), and the physics arms are an A/B:
          # the DEFAULT recovered Karma, and `legacy-karma` — MathEngine's own prebuilt archives —
          # as the reference it is judged against.
          #
          # ⚠ `native-nokarma` WAS RETIRED HERE in favour of `legacy-karma`. It compared physics
          # against NO physics, which only ever answered "is Karma involved in this failure"; the
          # legacy arm compares the recovered code against the real thing, which answers "is the
          # recovered code right". Both arms are downloadable from the same run, which is what makes
          # that comparison something a person can actually perform.
          #
          # ⚠ `legacy-karma` was itself removed from the engine on 2026-09-02 (BUILD_KARMA_REF) and
          # restored on 2026-09-12 for this. Read the option's note in CMakeLists.txt before deleting
          # it a second time — a matrix entry for a preset that does not exist does not fail fast,
          # it hangs the job for hours, which is how the 2026-09-06..11 runs went red.
          #
          # ⚠ The output NAMES encode the physics, deliberately. `native` and `native-nokarma` both
          # produced `ut2004-pixo.bin` once — same filename, opposite physics — and the two arms of
          # an A/B cannot share a filename if anyone is to download both.
          #
          # ufront 2.54: `arch` selects the apt toolchain below. Both 32-bit arms keep Pixomatic (its
          # prebuilts are i386-only and there is no source); the 64-bit arm cannot have it and says so
          # in its own name rather than shipping a `-pixo` binary with no Pixomatic in it. The legacy
          # arm has no 64-bit counterpart for the same reason and a stronger one: MathEngine shipped
          # Karma as binary-only i386 objects.
          - preset: native
            bin: ut2004-pixo.bin
            karma: recovered
            arch: '32'
          - preset: legacy-karma
            bin: ut2004-legacykarma-pixo.bin
            karma: legacy
            arch: '32'
          - preset: native64
            bin: ut2004.bin
            karma: recovered
            arch: '64'
    steps:
      # The image is bare: even git has to be installed before checkout can use it.
      - name: Base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake make pkg-config

      - uses: actions/checkout@v4

      # A 32-bit build (-m32): every dev package has to be the :i386 one. gcc-13 is what the preset pins.
      # SDL2 is built FROM SOURCE here (FetchContent) with SDL_X11 forced on, so it needs the i386 X11
      # development headers too — a shorter list makes SDL2 configure "successfully" without a video
      # driver, and the failure only shows up as a black window much later.
      - name: Install the 32-bit toolchain
        if: matrix.arch == '32'
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-13 g++-13 gcc-13-multilib g++-13-multilib \
            libsdl2-dev:i386 libopenal-dev:i386 \
            libx11-dev:i386 libxext-dev:i386 libxrandr-dev:i386 libxcursor-dev:i386 \
            libxi-dev:i386 libxss-dev:i386 libxxf86vm-dev:i386 libgl-dev:i386

      # ufront 2.54 — the 64-bit arm. Same package list WITHOUT the :i386 suffixes; no multilib,
      # and no Pixomatic (see the matrix note), so nothing here is the 32-bit list minus something.
      - name: Install the 64-bit toolchain
        if: matrix.arch == '64'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-13 g++-13 \
            libsdl2-dev libopenal-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxxf86vm-dev libgl-dev

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-${{ matrix.preset }}/_deps
          key: deps-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'Source/*/CMakeLists.txt', 'cmake/*.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build-${{ matrix.preset }} -j$(nproc)

      - name: Check the artifacts exist
        run: |
          test -x build-${{ matrix.preset }}/Source/SDLLaunch/${{ matrix.bin }}
          test -x build-${{ matrix.preset }}/Source/UCC/ucc-bin.bin

      # ★ ASSERT THE PHYSICS THAT WAS ASKED FOR IS ACTUALLY IN THERE. `option()` reads an existing
      # cache before its default, so a build directory configured before the 2026-08-27 flip keeps
      # NO_KARMA silently and the only symptom is a game with no vehicles. A cached CI `_deps` dir
      # can do the same. The symbol count is the cheapest thing that cannot be fooled by either.
      - name: Assert the binary carries the physics this preset asked for
        run: |
          set -euo pipefail
          bin=build-${{ matrix.preset }}/Source/SDLLaunch/${{ matrix.bin }}
          n=$(nm "$bin" | grep -cE ' [TD] (McdBoxBoxIntersect|MdtBSJointCreate|McdGjkCgIntersect)$' || true)
          echo "${{ matrix.preset }}: $n of 3 Karma entry points present"
          if [ "${{ matrix.karma }}" = "none" ]; then
            [ "$n" -eq 0 ] || { echo "::error::NO_KARMA build contains Karma symbols"; exit 1; }
          else
            [ "$n" -eq 3 ] || { echo "::error::Karma build is missing Karma symbols — stale cache?"; exit 1; }
          fi
          # ★ AND WHICH IMPLEMENTATION, because the entry-point count above cannot tell them apart.
          # The recovered Karma exists precisely to define the same API, so BOTH arms show 3 of 3,
          # and a legacy arm that silently fell back to the recovered sources would sail through
          # while making the A/B compare a build against itself — the one failure this arm must not
          # have. `_kdbytes` is the recovered sources' own suffix for the static byte arrays their
          # decompiler emits: measured at 12 in every recovered binary (Linux x86, Linux x86-64 and
          # Windows alike) and 0 in both legacy binaries.
          #
          # ⚠ It is a NAMING CONVENTION IN ANOTHER REPOSITORY, so it can be renamed out from under
          # this check. That is acceptable only because of which way it then fails: a rename makes
          # the recovered arms report 0 and go RED here, rather than making the legacy arm quietly
          # pass. Do not "fix" such a failure by deleting the check.
          kd=$(nm "$bin" | grep -c '_kdbytes' || true)
          echo "${{ matrix.preset }}: $kd recovered-Karma (_kdbytes) symbols"
          if [ "${{ matrix.karma }}" = "legacy" ]; then
            [ "$kd" -eq 0 ] || { echo "::error::the legacy arm contains RECOVERED Karma symbols — it did not link MathEngine's archives, so the A/B would be vacuous"; exit 1; }
          elif [ "${{ matrix.karma }}" = "recovered" ]; then
            [ "$kd" -gt 0 ] || { echo "::error::${{ matrix.preset }} carries no recovered-Karma symbols (renamed upstream, or this is not the physics it claims)"; exit 1; }
          fi

      # ⚠ RETENTION IS LOAD-BEARING, not tidiness. Every job here built and passed its own
      # assertions on 2026-08-27 and the run was still RED, because `upload-artifact` failed with
      # "Artifact storage quota has been hit". The default retention is 90 days and nothing here
      # ever set it, so three engine repos had accumulated 145 artifacts / 2.13 GB that would
      # never expire. 7 days is ~13x less standing storage at the same commit rate, and the
      # artifact of a push older than a week has never once been the one anybody wanted.
      - uses: actions/upload-artifact@v4
        with:
          name: ut2004-linux-${{ matrix.preset }}
          path: |
            build-${{ matrix.preset }}/Source/SDLLaunch/${{ matrix.bin }}
            build-${{ matrix.preset }}/Source/UCC/ucc-bin.bin
          if-no-files-found: error
          retention-days: 7

  windows:
    name: windows ${{ matrix.preset }} (MinGW-w64 cross)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # ufront 2.54 — BOTH WIDTHS, and they are not the same binary minus a flag.
          #
          # 32-bit carries PIXOMATIC, which renames the exe to `ut2004-pixo.exe` and adds ONE
          # non-system import. ⚠ That import is LOAD-TIME, not lazy: pixomatic.lib is a pure import
          # library and there is no /DELAYLOAD, so a missing pixomatic.dll means the process does not
          # start at all — measured with objdump, whose Delay Import Directory on this exe is empty.
          # The DLL is vendored (Thirdparty/Pixomatic/Bin) and staged beside the exe by
          # Source/SDLLaunch/CMakeLists.txt, so the ARTIFACT stays self-contained; it must therefore
          # ship both files, and the import allow-list below has to admit exactly that one DLL.
          #
          # 64-bit cannot have Pixomatic at all — the prebuilts are i386-only on both platforms and
          # there is no source — so it keeps the plain `ut2004.exe` name and the strict allow-list.
          - preset: windows
            bin: ut2004-pixo.exe
            karma: recovered
            objdump: i686-w64-mingw32-objdump
            nm: i686-w64-mingw32-nm
            # i686-PE decorates C symbols with a leading underscore; x86_64-PE does not.
            sym_prefix: '_'
            extra_dll: pixomatic.dll
          # ⚠ THERE IS NO WINDOWS LEGACY-KARMA ARM, and that is a measured conclusion rather than
          # an omission. One existed on 2026-09-12 and was removed the same day: MathEngine's win32
          # archives DO link with MinGW (the long-standing "they are 32-bit Linux ELF" note was
          # wrong) and the exe boots and simulates Karma, but GNU ld drops their cross-object COMDAT
          # relocations and emits `call` with displacement 0 at 42 sites in the collision core —
          # each a silent 4-byte stack shift. The engine now refuses that configuration at CONFIGURE
          # time. See BUILD_KARMA_REF's note in CMakeLists.txt. The A/B reference arm is LINUX.
          - preset: windows64
            bin: ut2004.exe
            karma: recovered
            objdump: x86_64-w64-mingw32-objdump
            nm: x86_64-w64-mingw32-nm
            sym_prefix: ''
            extra_dll: ''
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-${{ matrix.preset }}/_deps
          key: deps-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'Source/*/CMakeLists.txt', 'cmake/*.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build-${{ matrix.preset }} -j$(nproc)

      # ★ The check that matters for a "drop it somewhere and run it" binary. Without -static-libgcc /
      # -static-libstdc++ the exe imports libgcc_s_dw2-1.dll and libstdc++-6.dll and runs ONLY on the
      # machine that built it — and nothing else in the build fails when that happens. Retiring SDL 1.2
      # in 2.34 is what removed the last non-system import (SDL.dll) from this target.
      # The Windows target gained the recovered Karma on 2026-08-27, which took three portability
      # fixes nothing else could surface: alloca.h vs malloc.h, MEAPI declaring the API __stdcall
      # against cdecl recovered code, and asm labels missing i686-PE's leading underscore. All three
      # produced a CLEAN COMPILE and a broken link or a wrong ABI, so assert the result rather than
      # the exit code.
      - name: Assert the exe carries the Karma this preset asked for
        run: |
          set -euo pipefail
          exe=build-${{ matrix.preset }}/Source/SDLLaunch/${{ matrix.bin }}
          # ⚠ THE @N SUFFIX IS NOT OPTIONAL HERE AND IT IS NOT COSMETIC. Under WIN32 the metoolkit
          # headers declare the API __stdcall, so i686-PE decorates these as `_McdBoxBoxIntersect@8`.
          # A build that lost that convention — ME_FORCE_CDECL leaking onto the legacy arm is the way
          # it happens — produces the UNDECORATED name instead, links perfectly against the archives'
          # own decorated ones only by accident, and corrupts the stack at the first Karma call. So
          # the pattern accepts either spelling and the next step reports which was found.
          n=$(${{ matrix.nm }} "$exe" \
              | grep -cE " [TD] ${{ matrix.sym_prefix }}(McdBoxBoxIntersect|MdtBSJointCreate|McdGjkCgIntersect)(@[0-9]+)?$" || true)
          echo "${{ matrix.preset }}: $n of 3 Karma entry points present"
          [ "$n" -eq 3 ] || { echo "::error::${{ matrix.preset }} exe is missing Karma symbols"; exit 1; }
          # ★ AND WHICH IMPLEMENTATION — see the same check in the linux job for why the count above
          # cannot answer it and why `_kdbytes` failing loudly is the acceptable kind of fragility.
          # Both Windows arms are the recovered Karma (there is no legacy one — see the matrix note).
          kd=$(${{ matrix.nm }} "$exe" | grep -c '_kdbytes' || true)
          echo "${{ matrix.preset }}: $kd recovered-Karma (_kdbytes) symbols"
          [ "$kd" -gt 0 ] || { echo "::error::${{ matrix.preset }} carries no recovered-Karma symbols (renamed upstream, or this is not the physics it claims)"; exit 1; }

      # ★ The check that matters for a "drop it somewhere and run it" binary — now width-aware.
      # The allow-list admits exactly one extra DLL, the one this preset is supposed to carry, so a
      # stray libgcc_s/libstdc++ import still fails the build. ⚠ And on the Pixomatic arm the import
      # is only half the story: because it binds at LOAD time, an artifact without the DLL beside the
      # exe is a download that cannot start. Assert the file is actually staged, not just imported.
      - name: Assert the exe imports nothing but system DLLs (+ this preset's own)
        run: |
          set -euo pipefail
          exe=build-${{ matrix.preset }}/Source/SDLLaunch/${{ matrix.bin }}
          imports=$(${{ matrix.objdump }} -p "$exe" | sed -n 's/^\tDLL Name: //p' | sort -u)
          echo "$imports"
          # Exact-match against a name list rather than splicing regex fragments: an earlier version
          # appended the extra DLL by stripping the trailing `$`, which quietly unanchored the system
          # alternatives and would have accepted `KERNEL32.dll.anything`.
          allowed="ADVAPI32.dll GDI32.dll IMM32.dll KERNEL32.dll msvcrt.dll ole32.dll OLEAUT32.dll OPENGL32.dll SETUPAPI.dll SHELL32.dll USER32.dll VERSION.dll WINMM.dll WS2_32.dll ${{ matrix.extra_dll }}"
          bad=""
          for imp in $imports; do
            ok=0
            for a in $allowed; do
              [ "$(echo "$imp" | tr 'A-Z' 'a-z')" = "$(echo "$a" | tr 'A-Z' 'a-z')" ] && ok=1 && break
            done
            [ "$ok" -eq 1 ] || bad="$bad $imp"
          done
          if [ -n "$bad" ]; then echo "::error::non-system DLL imports:$bad"; exit 1; fi
          # ufront 2026-09-12: use ${{ matrix.extra_dll }} directly, as the allow-list above does.
          # The bash var $extra was never set, so `set -u` aborted every Pixomatic-arm run here with
          # "extra: unbound variable" — the exe was fine (it imports pixomatic.dll as intended), the
          # assertion referenced an undefined variable.
          if [ -n "${{ matrix.extra_dll }}" ]; then
            staged="build-${{ matrix.preset }}/Source/SDLLaunch/${{ matrix.extra_dll }}"
            test -f "$staged" || { echo "::error::${{ matrix.extra_dll }} is a LOAD-TIME import but was not staged beside the exe — the artifact would not start"; exit 1; }
            echo "staged ${{ matrix.extra_dll }} ($(stat -c%s "$staged") bytes)"
          fi

      # ⚠ RETENTION IS LOAD-BEARING, not tidiness. Every job here built and passed its own
      # assertions on 2026-08-27 and the run was still RED, because `upload-artifact` failed with
      # "Artifact storage quota has been hit". The default retention is 90 days and nothing here
      # ever set it, so three engine repos had accumulated 145 artifacts / 2.13 GB that would
      # never expire. 7 days is ~13x less standing storage at the same commit rate, and the
      # artifact of a push older than a week has never once been the one anybody wanted.
      - uses: actions/upload-artifact@v4
        with:
          name: ut2004-${{ matrix.preset }}
          # ⚠ The DLL is part of the deliverable on the Pixomatic arm, not an extra: the exe imports
          # it at load time, so an artifact with only the .exe is a download that refuses to start.
          # The glob is harmless on the 64-bit arm, which stages no DLL.
          path: |
            build-${{ matrix.preset }}/Source/SDLLaunch/${{ matrix.bin }}
            build-${{ matrix.preset }}/Source/SDLLaunch/*.dll
          if-no-files-found: error
          retention-days: 7

  android:
    name: android (x86_64 + arm64 + armv7 APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # The NDK and the CMake the Gradle plugin asks for; the versions match app/build.gradle's
      # ndkVersion, because AGP silently downloads its own on a mismatch and then CI is not building what
      # the local build builds. local.properties in the repo points at the owner's SDK; CI has its own.
      - name: Install the NDK + CMake and point the build at this runner's SDK
        run: |
          sdkmanager --install "ndk;30.0.14904198" "cmake;4.1.2" >/dev/null
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/30.0.14904198\n' "$ANDROID_HOME" "$ANDROID_HOME" > Android/local.properties

      - name: Build the APK
        run: ./gradlew assembleDebug --console=plain
        working-directory: Android

      # All three ABIs must be in there. A silent drop to one ABI is the failure mode worth catching:
      # the APK still installs, and only fails on the device you did not test.
      - name: Assert every ABI is packaged
        run: |
          set -euo pipefail
          apk=Android/app/build/outputs/apk/debug/app-debug.apk
          for abi in x86_64 arm64-v8a armeabi-v7a; do
            unzip -l "$apk" | grep -q "lib/$abi/libUT2004.so" || { echo "::error::missing $abi"; exit 1; }
          done

      # ⚠ RETENTION IS LOAD-BEARING, not tidiness. Every job here built and passed its own
      # assertions on 2026-08-27 and the run was still RED, because `upload-artifact` failed with
      # "Artifact storage quota has been hit". The default retention is 90 days and nothing here
      # ever set it, so three engine repos had accumulated 145 artifacts / 2.13 GB that would
      # never expire. 7 days is ~13x less standing storage at the same commit rate, and the
      # artifact of a push older than a week has never once been the one anybody wanted.
      - uses: actions/upload-artifact@v4
        with:
          name: ut2004-android
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # THE ROLLING "latest" RELEASE — the answer to "the 7-day age is fine, but it
  # must not take the newest build with it" (owner, 2026-09-12).
  #
  # ★ IT IS A RELEASE AND NOT A LONGER RETENTION BECAUSE ARTIFACT RETENTION CANNOT
  # EXPRESS THIS. GitHub expires artifacts purely by age; there is no "keep the
  # latest" flag, and raising retention-days only moves the cliff — a repository
  # nobody pushes to for ninety days still ends up with nothing to download, which
  # is precisely the case where you most want the last good build. RELEASE ASSETS
  # DO NOT EXPIRE. So per-push artifacts keep their deliberately short 7 days (see
  # the retention note on every upload above — that limit is what stopped the
  # quota from turning whole runs red), and the newest build of a tracked branch
  # is additionally copied here, where it stays until the next one replaces it.
  #
  # ⚠ DELETE-THEN-CREATE, ON PURPOSE. A rolling tag has to MOVE, and `gh release
  # edit --target` does not move a published release's tag. Recreating it also
  # drops assets that are no longer produced, so a retired build arm cannot leave
  # a stale binary sitting in "latest" looking current. The cost is a few seconds
  # where the tag does not exist; the alternative is a release that silently
  # describes a commit it no longer contains.
  #
  # ⚠ `permissions: contents: write` IS LOAD-BEARING. This repository's default
  # workflow token is READ-ONLY, so without this key every step below succeeds and
  # the final one fails with HTTP 403.
  #
  # ⚠ NOT EVERY BUILD THE OWNER RUNS IS HERE. The WEB target is absent from this
  # workflow (its link preloads a file from the retail asset tree — see the header),
  # so "latest" carries the six native/Android builds and says nothing about the
  # wasm one, which is built and published from the owner's box.
  latest:
    name: rolling "latest" release
    needs: [linux, windows, android]
    if: github.event_name == 'push' && (github.ref_name == 'main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Every artifact this run produced, each in its own directory named after it.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack one zip per build
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          n=0
          for d in artifacts/*/; do
            name=$(basename "$d")
            ( cd "$d" && zip -qr "$GITHUB_WORKSPACE/out/$name.zip" . )
            n=$((n + 1))
          done
          # ⚠ A release that publishes NOTHING is worse than a failed job: it looks
          # like a successful build whose downloads have quietly gone missing.
          [ "$n" -gt 0 ] || { echo "::error::no artifacts were downloaded — nothing to publish"; exit 1; }
          echo "packed $n build(s):"
          ls -la out/

      - name: Publish (replacing the previous one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One rolling tag per tracked branch, so branches cannot overwrite each
          # other's "latest". The default branch keeps the bare name.
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
            tag="latest"
          else
            tag="latest-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          fi
          echo "tag: $tag"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" out/*.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$tag — $(git log -1 --format=%s | cut -c1-72)" \
            --notes "$(printf '%s\n' \
              "The newest UT2004 engine build of \`$GITHUB_REF_NAME\`, rebuilt and replaced on every push." \
              "" \
              "Commit: \`$GITHUB_SHA\`" \
              "Built: $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "" \
              "These assets do not expire. The per-push artifacts on the run page do, after 7 days.")"
