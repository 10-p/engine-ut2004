name: build

# CI for the engine build matrix: build on every push and pull request and upload the binaries as
# workflow artifacts (and the newest build of a tracked branch as the rolling "latest" release).
#
# It does not run the game (a hosted runner has no GPU). The web job builds `wasm-perf` to prove it links
# and emits its descriptor, and uploads nothing: the web link embeds `${UE_ASSETS_DIR}/System/Build.ini` and
# `System/Packages.md5`, files of the retail asset tree that are not in this repository, so the job links
# empty stand-ins and its output is not a playable artifact.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    # A container, not the bare runner: the runner image preinstalls amd64 -dev packages that make
    # `libsdl2-dev:i386` uninstallable (libglib2.0-dev-bin is Multi-Arch: foreign, so apt ends in "held
    # broken packages"). A stock ubuntu:24.04 resolves multiarch normally.
    container: ubuntu:24.04
    # A container job defaults to `sh -e`, not bash, and dash has no `set -o pipefail`: pin bash.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # The physics arms are an A/B: the default recovered Karma, and `legacy-karma` (MathEngine's
          # own prebuilt archives) as the reference it is judged against. Both arms download from the
          # same run, and their output names encode the physics so the two can be told apart. A matrix
          # entry for a preset that does not exist does not fail fast; it hangs the job.
          #
          # `arch` selects the apt toolchain below. Both 32-bit arms keep Pixomatic (its prebuilts are
          # i386-only and there is no source); the 64-bit arm cannot have it and its name says so. The
          # legacy arm has no 64-bit counterpart: MathEngine shipped Karma as binary-only i386 objects.
          - preset: native
            bin: ut2004-pixo.bin
            karma: recovered
            arch: '32'
          - preset: legacy-karma
            bin: ut2004-legacykarma-pixo.bin
            karma: legacy
            arch: '32'
          - preset: native64
            bin: ut2004.bin
            karma: recovered
            arch: '64'
    steps:
      # The image is bare: even git has to be installed before checkout can use it.
      - name: Base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake make pkg-config

      - uses: actions/checkout@v4

      # A 32-bit build (-m32): every dev package has to be the :i386 one. The presets use the system gcc;
      # this job installs only the versioned gcc-13 (no unversioned `gcc`/`cc` in the container), so
      # Configure names it. SDL2 is built from source here (FetchContent) with SDL_X11 forced on, so it
      # needs the i386 X11 development headers too: a shorter list makes SDL2 configure without a video
      # driver, and the failure only shows up as a black window much later.
      - name: Install the 32-bit toolchain
        if: matrix.arch == '32'
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-13 g++-13 gcc-13-multilib g++-13-multilib \
            libsdl2-dev:i386 libopenal-dev:i386 \
            libx11-dev:i386 libxext-dev:i386 libxrandr-dev:i386 libxcursor-dev:i386 \
            libxi-dev:i386 libxss-dev:i386 libxxf86vm-dev:i386 libgl-dev:i386

      # The 64-bit arm: the same package list without the :i386 suffixes; no multilib, and no
      # Pixomatic (see the matrix note).
      - name: Install the 64-bit toolchain
        if: matrix.arch == '64'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-13 g++-13 \
            libsdl2-dev libopenal-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxxf86vm-dev libgl-dev

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-${{ matrix.preset }}/_deps
          key: deps-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'Source/*/CMakeLists.txt', 'cmake/*.cmake') }}

      # Name the compiler this job tests: the presets use the system compiler, and the container has no
      # default `cc` (only the versioned gcc-13 installed above).
      - name: Configure
        env:
          CC: gcc-13
          CXX: g++-13
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build-${{ matrix.preset }} -j$(nproc)

      - name: Check the artifacts exist
        run: |
          test -x build-${{ matrix.preset }}/Source/SDLLaunch/${{ matrix.bin }}
          test -x build-${{ matrix.preset }}/Source/UCC/ucc-bin

      # Assert the physics that was asked for is in the binary: `option()` reads an existing cache before
      # its default, so a stale build directory (or a cached CI `_deps` dir) can keep NO_KARMA silently,
      # and the only symptom is a game with no vehicles. The symbol count cannot be fooled by either.
      - name: Assert the binary carries the physics this preset asked for
        run: |
          set -euo pipefail
          bin=build-${{ matrix.preset }}/Source/SDLLaunch/${{ matrix.bin }}
          n=$(nm "$bin" | grep -cE ' [TD] (McdBoxBoxIntersect|MdtBSJointCreate|McdGjkCgIntersect)$' || true)
          echo "${{ matrix.preset }}: $n of 3 Karma entry points present"
          if [ "${{ matrix.karma }}" = "none" ]; then
            [ "$n" -eq 0 ] || { echo "::error::NO_KARMA build contains Karma symbols"; exit 1; }
          else
            [ "$n" -eq 3 ] || { echo "::error::Karma build is missing Karma symbols — stale cache?"; exit 1; }
          fi
          # And which implementation, because the entry-point count above cannot tell them apart: the
          # recovered Karma defines the same API, so both arms show 3 of 3, and a legacy arm that fell
          # back to the recovered sources would compare a build against itself. `_kdbytes` is the
          # recovered sources' own suffix for the static byte arrays their decompiler emits: 12 in every
          # recovered binary (Linux x86, Linux x86-64 and Windows alike) and 0 in the legacy one.
          #
          # It is a naming convention in another repository, so a rename there makes the recovered arms
          # report 0 and go red here (the safe direction). Do not fix such a failure by deleting the check.
          kd=$(nm "$bin" | grep -c '_kdbytes' || true)
          echo "${{ matrix.preset }}: $kd recovered-Karma (_kdbytes) symbols"
          if [ "${{ matrix.karma }}" = "legacy" ]; then
            [ "$kd" -eq 0 ] || { echo "::error::the legacy arm contains RECOVERED Karma symbols — it did not link MathEngine's archives, so the A/B would be vacuous"; exit 1; }
          elif [ "${{ matrix.karma }}" = "recovered" ]; then
            [ "$kd" -gt 0 ] || { echo "::error::${{ matrix.preset }} carries no recovered-Karma symbols (renamed upstream, or this is not the physics it claims)"; exit 1; }
          fi

      # Retention: 7 days. The default (90) fills the artifact storage quota, and a full quota fails
      # `upload-artifact` and turns the run red. The newest build is kept in the "latest" release.
      - uses: actions/upload-artifact@v4
        with:
          name: ut2004-linux-${{ matrix.preset }}
          path: |
            build-${{ matrix.preset }}/Source/SDLLaunch/${{ matrix.bin }}
            build-${{ matrix.preset }}/Source/UCC/ucc-bin
          if-no-files-found: error
          retention-days: 7

  windows:
    name: windows ${{ matrix.preset }} (MinGW-w64 cross)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both widths. 32-bit carries Pixomatic, which renames the exe to `ut2004-pixo.exe` and adds
          # one non-system import. That import is load-time, not lazy (pixomatic.lib is a pure import
          # library, no /DELAYLOAD), so without pixomatic.dll the process does not start. The DLL is
          # vendored (Thirdparty/Pixomatic/Bin) and staged beside the exe by
          # Source/SDLLaunch/CMakeLists.txt, so the artifact ships both files and the import allow-list
          # below admits exactly that one DLL.
          #
          # 64-bit cannot have Pixomatic (the prebuilts are i386-only and there is no source), so it
          # keeps the plain `ut2004.exe` name and the strict allow-list.
          - preset: windows
            bin: ut2004-pixo.exe
            karma: recovered
            objdump: i686-w64-mingw32-objdump
            nm: i686-w64-mingw32-nm
            # i686-PE decorates C symbols with a leading underscore; x86_64-PE does not.
            sym_prefix: '_'
            extra_dll: pixomatic.dll
          # There is no Windows legacy-karma arm: MathEngine's win32 archives link with MinGW and the
          # exe boots, but GNU ld drops their cross-object COMDAT relocations (`call` with
          # displacement 0 at 42 sites in the collision core, each a silent 4-byte stack shift), so the
          # engine refuses that configuration at configure time (BUILD_KARMA_REF's note in
          # CMakeLists.txt). The A/B reference arm is Linux.
          - preset: windows64
            bin: ut2004.exe
            karma: recovered
            objdump: x86_64-w64-mingw32-objdump
            nm: x86_64-w64-mingw32-nm
            sym_prefix: ''
            extra_dll: ''
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-${{ matrix.preset }}/_deps
          key: deps-${{ matrix.preset }}-${{ hashFiles('CMakeLists.txt', 'Source/*/CMakeLists.txt', 'cmake/*.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build-${{ matrix.preset }} -j$(nproc)

      # Assert the result rather than the exit code: Windows Karma depends on portability details
      # (alloca.h vs malloc.h, MEAPI's __stdcall against cdecl recovered code, i686-PE's leading
      # underscore on asm labels) whose failure is a clean compile with a broken link or a wrong ABI.
      - name: Assert the exe carries the Karma this preset asked for
        run: |
          set -euo pipefail
          exe=build-${{ matrix.preset }}/Source/SDLLaunch/${{ matrix.bin }}
          # The @N suffix: under WIN32 the metoolkit headers declare the API __stdcall, so i686-PE
          # decorates these as `_McdBoxBoxIntersect@8`. A build that lost that convention (ME_FORCE_CDECL
          # leaking onto a stdcall build) produces the undecorated name and corrupts the stack at the
          # first Karma call. The pattern accepts either spelling and the next step reports which.
          n=$(${{ matrix.nm }} "$exe" \
              | grep -cE " [TD] ${{ matrix.sym_prefix }}(McdBoxBoxIntersect|MdtBSJointCreate|McdGjkCgIntersect)(@[0-9]+)?$" || true)
          echo "${{ matrix.preset }}: $n of 3 Karma entry points present"
          [ "$n" -eq 3 ] || { echo "::error::${{ matrix.preset }} exe is missing Karma symbols"; exit 1; }
          # And which implementation: see the same check in the linux job. Both Windows arms are the
          # recovered Karma (there is no legacy one; see the matrix note).
          kd=$(${{ matrix.nm }} "$exe" | grep -c '_kdbytes' || true)
          echo "${{ matrix.preset }}: $kd recovered-Karma (_kdbytes) symbols"
          [ "$kd" -gt 0 ] || { echo "::error::${{ matrix.preset }} carries no recovered-Karma symbols (renamed upstream, or this is not the physics it claims)"; exit 1; }

      # The check that matters for a "drop it somewhere and run it" binary: without -static-libgcc /
      # -static-libstdc++ the exe would import libgcc_s_dw2-1.dll and libstdc++-6.dll and run only on
      # the machine that built it. The allow-list admits exactly one extra DLL, the one this preset
      # carries; on the Pixomatic arm the step also asserts the DLL is staged beside the exe, because it
      # binds at load time.
      - name: Assert the exe imports nothing but system DLLs (+ this preset's own)
        run: |
          set -euo pipefail
          exe=build-${{ matrix.preset }}/Source/SDLLaunch/${{ matrix.bin }}
          imports=$(${{ matrix.objdump }} -p "$exe" | sed -n 's/^\tDLL Name: //p' | sort -u)
          echo "$imports"
          # Exact-match against a name list rather than splicing regex fragments, so the system
          # alternatives stay anchored.
          allowed="ADVAPI32.dll GDI32.dll IMM32.dll KERNEL32.dll msvcrt.dll ole32.dll OLEAUT32.dll OPENGL32.dll SETUPAPI.dll SHELL32.dll USER32.dll VERSION.dll WINMM.dll WS2_32.dll ${{ matrix.extra_dll }}"
          bad=""
          for imp in $imports; do
            ok=0
            for a in $allowed; do
              [ "$(echo "$imp" | tr 'A-Z' 'a-z')" = "$(echo "$a" | tr 'A-Z' 'a-z')" ] && ok=1 && break
            done
            [ "$ok" -eq 1 ] || bad="$bad $imp"
          done
          if [ -n "$bad" ]; then echo "::error::non-system DLL imports:$bad"; exit 1; fi
          if [ -n "${{ matrix.extra_dll }}" ]; then
            staged="build-${{ matrix.preset }}/Source/SDLLaunch/${{ matrix.extra_dll }}"
            test -f "$staged" || { echo "::error::${{ matrix.extra_dll }} is a LOAD-TIME import but was not staged beside the exe — the artifact would not start"; exit 1; }
            echo "staged ${{ matrix.extra_dll }} ($(stat -c%s "$staged") bytes)"
          fi

      # ucc.exe, the console tool, carries no DLL beside it: system DLLs only.
      - name: Assert ucc.exe imports nothing but system DLLs
        run: |
          set -euo pipefail
          imports=$(${{ matrix.objdump }} -p build-${{ matrix.preset }}/Source/UCC/ucc.exe | sed -n 's/^\tDLL Name: //p' | sort -u)
          echo "$imports"
          allowed="ADVAPI32.dll GDI32.dll IMM32.dll KERNEL32.dll msvcrt.dll ole32.dll OLEAUT32.dll SETUPAPI.dll SHELL32.dll USER32.dll VERSION.dll WINMM.dll WS2_32.dll"
          bad=""
          for imp in $imports; do
            ok=0
            for a in $allowed; do
              [ "$(echo "$imp" | tr 'A-Z' 'a-z')" = "$(echo "$a" | tr 'A-Z' 'a-z')" ] && ok=1 && break
            done
            [ "$ok" -eq 1 ] || bad="$bad $imp"
          done
          if [ -n "$bad" ]; then echo "::error::non-system DLL imports:$bad"; exit 1; fi

      # Retention: 7 days (see the linux job).
      - uses: actions/upload-artifact@v4
        with:
          name: ut2004-${{ matrix.preset }}
          # The DLL is part of the deliverable on the Pixomatic arm: the exe imports it at load time.
          # The glob is harmless on the 64-bit arm, which stages no DLL.
          path: |
            build-${{ matrix.preset }}/Source/SDLLaunch/${{ matrix.bin }}
            build-${{ matrix.preset }}/Source/SDLLaunch/*.dll
            build-${{ matrix.preset }}/Source/UCC/ucc.exe
          if-no-files-found: error
          retention-days: 7

  web:
    name: web (wasm-perf)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # emsdk must be on PATH before cmake configures (emcc is probed then); the preset's toolchain file
      # reads $EMSDK. The version is the one BUILD.md names.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7
          actions-cache-folder: emsdk-cache

      # A fresh emsdk has an empty ports cache, and the SDL2 port's headers reach the sysroot only once
      # the port is built.
      - name: Build the SDL2 port into the emsdk sysroot
        run: embuilder build sdl2

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-wasm-perf/_deps
          key: deps-wasm-perf-${{ hashFiles('CMakeLists.txt', 'Source/*/CMakeLists.txt', 'cmake/*.cmake') }}

      # The two install files the link embeds, as empty stand-ins (see the header).
      - name: Stand-in asset folder
        run: |
          mkdir -p "$RUNNER_TEMP/ut2004/System"
          : > "$RUNNER_TEMP/ut2004/System/Build.ini"
          : > "$RUNNER_TEMP/ut2004/System/Packages.md5"

      - name: Configure
        run: cmake --preset wasm-perf -DUE_ASSETS_DIR="$RUNNER_TEMP/ut2004"

      - name: Build
        run: cmake --build build-wasm-perf -j$(nproc)

      # The descriptor the frontend's build validates: present, and at the ABI version of vendor/glue/ue_abi.h.
      - name: Check the artifact and its meta.json
        run: |
          set -euo pipefail
          out=build-wasm-perf/Source/SDLLaunch
          for f in SDLLaunch.js SDLLaunch.wasm SDLLaunch.data meta.json; do
            test -s "$out/$f" || { echo "::error::$out/$f is missing or empty"; exit 1; }
          done
          want=$(sed -n 's/^#define UE_ABI_VERSION[[:space:]]\+\([0-9]\+\).*/\1/p' vendor/glue/ue_abi.h)
          got=$(python3 -c "import json;print(json.load(open('$out/meta.json'))['abiVersion'])")
          echo "meta.json abiVersion=$got, ue_abi.h UE_ABI_VERSION=$want"
          [ "$got" = "$want" ] || { echo "::error::meta.json abiVersion $got != UE_ABI_VERSION $want"; exit 1; }

  android:
    name: android (arm64 + arm32 APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # JDK 17: the Gradle daemon's (Android/gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Only platform-tools: the action's default list names `tools`, which the current SDK repository
      # (cmdline-tools 16.0) does not have. The NDK and CMake come from the next step.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The NDK and the CMake the Gradle plugin asks for; the versions match app/build.gradle's
      # ndkVersion, because AGP silently downloads its own on a mismatch. CI writes its own
      # local.properties for this runner's SDK.
      - name: Install the NDK + CMake and point the build at this runner's SDK
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;4.1.2" >/dev/null
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" "$ANDROID_HOME" > Android/local.properties

      - name: Build the APK
        run: ./gradlew assembleDebug --console=plain
        working-directory: Android

      # All three ABIs must be in there. A silent drop to one ABI is the failure mode worth catching:
      # the APK still installs, and only fails on the device you did not test.
      - name: Assert every ABI is packaged
        run: |
          set -euo pipefail
          apk=Android/app/build/outputs/apk/debug/app-debug.apk
          for abi in armeabi-v7a arm64-v8a; do
            unzip -l "$apk" | grep -q "lib/$abi/libUT2004.so" || { echo "::error::missing $abi"; exit 1; }
          done

      # Retention: 7 days (see the linux job).
      - uses: actions/upload-artifact@v4
        with:
          name: ut2004-android
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The rolling "latest" release: the newest build of a tracked branch, kept until the next one
  # replaces it. Artifact retention cannot express "keep the latest" (GitHub expires artifacts purely
  # by age), and release assets do not expire, so per-push artifacts keep their short 7 days.
  #
  # Delete-then-create: a rolling tag has to move, and `gh release edit --target` does not move a
  # published release's tag; recreating it also drops assets that are no longer produced, so a retired
  # build arm cannot leave a stale binary in "latest". The tag is absent for a few seconds.
  #
  # `permissions: contents: write` is required: this repository's default workflow token is read-only,
  # and without it the final step fails with HTTP 403.
  #
  # The web job uploads nothing (see the header), so "latest" carries the native, Windows and Android
  # builds only.
  latest:
    name: rolling "latest" release
    needs: [linux, windows, android]
    if: github.event_name == 'push' && (github.ref_name == 'main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Every artifact this run produced, each in its own directory named after it.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack one zip per build
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          n=0
          for d in artifacts/*/; do
            name=$(basename "$d")
            ( cd "$d" && zip -qr "$GITHUB_WORKSPACE/out/$name.zip" . )
            n=$((n + 1))
          done
          # A release that publishes nothing is worse than a failed job: it looks like a successful
          # build whose downloads have gone missing.
          [ "$n" -gt 0 ] || { echo "::error::no artifacts were downloaded — nothing to publish"; exit 1; }
          echo "packed $n build(s):"
          ls -la out/

      - name: Publish (replacing the previous one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One rolling tag per tracked branch, so branches cannot overwrite each
          # other's "latest". The default branch keeps the bare name.
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
            tag="latest"
          else
            tag="latest-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          fi
          echo "tag: $tag"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" out/*.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$tag — $(git log -1 --format=%s | cut -c1-72)" \
            --notes "$(printf '%s\n' \
              "The newest UT2004 engine build of \`$GITHUB_REF_NAME\`, rebuilt and replaced on every push." \
              "" \
              "Commit: \`$GITHUB_SHA\`" \
              "Built: $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "" \
              "These assets do not expire. The per-push artifacts on the run page do, after 7 days.")"
