plugins { id 'com.android.application' }

// Signing: ueAndroidSigning (a Gradle property, e.g. in ~/.gradle/gradle.properties) or UE_ANDROID_SIGNING names a
// properties file kept outside the repository with storeFile, storePassword, keyAlias and keyPassword. With it every
// variant is signed with that key, so each new APK installs over the last; without it, with the debug key.
def ueSigningPath = project.findProperty('ueAndroidSigning') ?: System.getenv('UE_ANDROID_SIGNING')
def ueSigning = null
if (ueSigningPath) {
    def signingFile = file(ueSigningPath)
    if (!signingFile.isFile())
        throw new GradleException("ueAndroidSigning=${ueSigningPath} is not a file")
    ueSigning = new Properties()
    signingFile.withInputStream { ueSigning.load(it) }
}

android {
    namespace = 'com.ut2004.android'
    // Android 16 (platform 36); the app keeps Android 14's behaviour (targetSdk).
    compileSdk = 36
    // Ubuntu's google-android-ndk-r28c-installer (BUILD.md, "Android").
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId = 'com.ut2004.android'
        minSdk = 24
        targetSdk = 34
        versionCode = 10100
        versionName = '1.1.0'
        // The ABIs of every APK: 32-bit and 64-bit ARM devices, and x86_64 (x86 Chromebooks, the emulator).
        // `-Px86abi` adds a 32-bit x86, which is not for shipping: it runs the same APK at 32-bit on an x86
        // emulator image (`system-images;android-24;google_apis_playstore;x86`, this minSdk), a pointer-width
        // control for the x86_64 one. API 34 images have no 32-bit ABI at all.
        def utAbis = ['armeabi-v7a', 'arm64-v8a', 'x86_64']
        if (project.hasProperty('x86abi')) { utAbis += 'x86' }
        ndk { abiFilters.addAll(utAbis) }
        externalNativeBuild {
            cmake {
                abiFilters.addAll(utAbis)
                // The SDL2 source directory is opt-in: `-Psdl2Dir=/abs/path` or SDL2_SOURCE_DIR in the
                // environment points at a local clone (skips the download and guarantees C/Java SDL
                // parity); with neither, FetchContent clones the pinned SDL2 itself.
                def sdl2Dir = project.findProperty('sdl2Dir') ?: System.getenv('SDL2_SOURCE_DIR')
                def cmakeArgs = ['-DANDROID_STL=c++_shared']
                // The recovered Karma is FetchContent'd from its own repository at `main`;
                // `-PkarmaDir=/abs/path` (or KARMA_DECOMP_DIR) passes
                // FETCHCONTENT_SOURCE_DIR_METOOLKITKARMADECOMP, so a change to the recovered sources can
                // be tested on a device before it is pushed. No absolute path is baked in.
                def karmaDir = project.findProperty('karmaDir') ?: System.getenv('KARMA_DECOMP_DIR')
                if (karmaDir) {
                    if (file(karmaDir).isDirectory()) {
                        cmakeArgs += "-DFETCHCONTENT_SOURCE_DIR_METOOLKITKARMADECOMP=${karmaDir}".toString()
                    } else {
                        logger.warn("karmaDir=${karmaDir} does not exist — letting FetchContent clone it")
                    }
                }
                // Karma is on by default on Android (LP64 Karma plays on arm64-v8a and armeabi-v7a);
                // `-PnoKarma` builds the physics-free APK (the control arm), and `-PkarmaDir=/path`
                // points at a local metoolkit-karma-decomp checkout.
                //
                // Verify in the artefact, not the Gradle log, which reports "BUILD SUCCESSFUL,
                // up-to-date" whether or not it recompiled:
                //   nm -D --defined-only <arm64 .so> | grep -c McdAggregateCreate
                //   llvm-objdump -d --disassemble-symbols=MePoolxDictNodeAllocate <.so>
                //     -> `mov x9, #0x10` / `#0x14` are the LP64 MePoolx offsets; 0xc/0x10 are the
                //        i386 ones and mean you are looking at a stale object.
                if (project.hasProperty('noKarma')) {
                    cmakeArgs += '-DUSE_KARMA_DECOMP=OFF'
                }
                // `-Pgl4esDir=/abs/path` (or GL4ES_SOURCE_DIR) builds a local gl4es checkout
                // (FETCHCONTENT_SOURCE_DIR_GL4ES) instead of the fork's branch.
                def gl4esDir = project.findProperty('gl4esDir') ?: System.getenv('GL4ES_SOURCE_DIR')
                if (gl4esDir) {
                    if (!file(gl4esDir).isDirectory())
                        throw new GradleException("gl4esDir=${gl4esDir} is not a directory")
                    cmakeArgs += "-DFETCHCONTENT_SOURCE_DIR_GL4ES=${gl4esDir}".toString()
                }
                if (sdl2Dir && file(sdl2Dir).isDirectory()) {
                    cmakeArgs += "-DFETCHCONTENT_SOURCE_DIR_SDL2=${sdl2Dir}".toString()
                } else if (sdl2Dir) {
                    logger.warn("sdl2Dir=${sdl2Dir} does not exist — letting FetchContent clone SDL2")
                }
                arguments.addAll(cmakeArgs)
                // OpenAL (openal-soft) is built and packaged but not linked into libUT2004 (see
                // SDLLaunch/CMakeLists.txt): ALAudio dlopens libopenal.so at audio init, after the
                // engine allocator is up. Listed here so AGP builds and packages the standalone target.
                targets.addAll(['SDLLaunch', 'ut2004_android_bridge', 'OpenAL'])
            }
        }
    }

    // The engine's own root CMakeLists: its if(ANDROID) branches build the SDLLaunch target as
    // libUT2004.so (whole-archive) alongside libSDL2.so.
    externalNativeBuild {
        cmake {
            path = file('../../CMakeLists.txt')
            version = '4.1.2+'
        }
    }

    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint { disable.add('ExpiredTargetSdkVersion') }

    signingConfigs {
        if (ueSigning) {
            release {
                storeFile = file(ueSigning.getProperty('storeFile'))
                storePassword = ueSigning.getProperty('storePassword')
                keyAlias = ueSigning.getProperty('keyAlias')
                keyPassword = ueSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release { signingConfig = ueSigning ? signingConfigs.release : signingConfigs.debug }
        debug { if (ueSigning) signingConfig = signingConfigs.release }
    }
}
