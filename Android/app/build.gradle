plugins { id 'com.android.application' }

android {
    namespace 'com.ut2004.android'
    compileSdk 34
    ndkVersion '30.0.14904198'

    defaultConfig {
        applicationId 'com.ut2004.android'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
        // ★ THE SHIPPED ABI SET, PLUS AN OPT-IN 32-BIT x86 FOR ONE EXPERIMENT.
        //
        // `-Px86abi` adds x86 (32-bit). It is NOT for shipping — no phone has been x86 for years
        // — it exists to answer the question the Karma block below could not: is the Android
        // Karma SIGSEGV an LP64 defect or an Android-integration one?
        //
        // Karma has never been enabled on Android at ANY pointer width, so there was nothing to
        // compare against. Of the three shipped ABIs, two are 64-bit and the third (armeabi-v7a)
        // cannot execute on an x86_64 emulator. That left "attach the OnePlus 6", and the note
        // below recorded the question as blocked.
        //
        // It is not blocked. `system-images;android-24;google_apis_playstore;x86` is a 32-bit
        // image at exactly this minSdk, so x86 vs x86_64 is the SAME emulator family, the same
        // APK build, the same map — differing in pointer width and nothing else. That is the
        // control the attribution needs. API 34 itself has no 32-bit ABI at all
        // (`ro.product.cpu.abilist32` is empty), which is what "ABI x86 not supported on this
        // device" was really saying.
        def utAbis = ['x86_64', 'arm64-v8a', 'armeabi-v7a']
        if (project.hasProperty('x86abi')) { utAbis += 'x86' }
        ndk { abiFilters(*utAbis) }
        externalNativeBuild {
            cmake {
                abiFilters(*utAbis)
                // ufront 2.34 — the SDL2 source directory is OPT-IN, not baked in. This used to be a hard
                // '-DFETCHCONTENT_SOURCE_DIR_SDL2=/home/ion/engines/.cache-sdl2-2.32', an absolute path on
                // one machine; anywhere else FetchContent stops with "Manually specified source directory
                // is missing" — which is exactly what CI hit on its first run. Point it at a local clone
                // with `-Psdl2Dir=/abs/path` or SDL2_SOURCE_DIR in the environment to skip the download and
                // guarantee C/Java SDL parity; with neither, FetchContent clones the pinned SDL2 itself.
                def sdl2Dir = project.findProperty('sdl2Dir') ?: System.getenv('SDL2_SOURCE_DIR')
                def cmakeArgs = ['-DANDROID_STL=c++_shared', '-DUT_GFX_BACKEND=gl4es']
                // The recovered Karma is FetchContent'd from its own repository at `main`, and
                // the root CMakeLists says how to override that: point
                // FETCHCONTENT_SOURCE_DIR_METOOLKITKARMADECOMP at a local checkout. This is the
                // way to pass it from here — `-PkarmaDir=/abs/path` — which is how a change to
                // the recovered sources gets tested on a device BEFORE it is pushed. Same shape
                // as `sdl2Dir` above, and the same reason: no absolute path is baked in.
                def karmaDir = project.findProperty('karmaDir') ?: System.getenv('KARMA_DECOMP_DIR')
                if (karmaDir) {
                    if (file(karmaDir).isDirectory()) {
                        cmakeArgs += "-DFETCHCONTENT_SOURCE_DIR_METOOLKITKARMADECOMP=${karmaDir}".toString()
                    } else {
                        logger.warn("karmaDir=${karmaDir} does not exist — letting FetchContent clone it")
                    }
                }
                // ★ KARMA IS STILL OFF ON ANDROID, AND THE REASON CHANGED AGAIN ON 2026-08-30.
                //
                // IT WAS the LP64 layout defect, and the note here used to say that was fixed.
                // ⚠ IT WAS NOT — `metoolkit-karma-decomp` proved on 2026-08-30 that its own gate
                // was reporting PASS over a build whose ragdoll scene gave a different answer on
                // every run (proven.txt LP64-ADDRESS-DEPENDENT). That IS now fixed and MEASURED:
                // with the arithmetic held fixed (-ffloat-store) two of the three offline scenes
                // are BYTE-IDENTICAL at i386 and LP64 over all 901 rows, and 100 runs of the
                // plain -m64 ragdoll give one answer. proven.txt LP64-CLOSED.
                //
                // ⚠ AND TURNING IT ON HERE STILL CRASHES. Re-measured 2026-08-30 on the API-34
                // x86_64 emulator with the repaired sources, same APK, same 11 GB tree:
                //
                //   Karma ON  : SIGSEGV on the engine thread immediately after
                //               "[GL4ES-DBG] Init: complete, returning 1", 501 lines of log
                //   Karma OFF : same APK, same ini, same tree — reaches UT2k4MainMenu.Opened(),
                //               2153 lines
                //
                // The repairs moved it: 243 lines before, 501 now. They did not remove it. So
                // the Android SIGSEGV is NOT the layout defect that was located and closed, and
                // treating it as such would be the second time this note was wrong.
                //
                // ★ THE 32-BIT CONTROL EXISTS NOW, and it is what `-Px86abi` is for.
                // `system-images;android-24;google_apis_playstore;x86` is a 32-bit image, so the
                // same APK runs the same engine at the shipped pointer width. Measured the same
                // day: Karma ON at x86 boots the engine, loads UnrealScript and is still running
                // at 902 log lines. ⚠ READ THAT AS PARTIAL: that emulator holds 5.8 GB and the
                // tree is 11 GB, so it was run against System + Animations + KarmaData and had
                // NOT yet reached the renderer init where the 64-bit build dies. It is evidence
                // that 32-bit Karma starts, not yet evidence that it passes the same point.
                //
                // NEXT: a backtrace. The engine installs its own SIGSEGV handler (UnUnix.cpp,
                // SA_RESETHAND) so there is no tombstone; attach the NDK's lldb-server, or build
                // one APK with that handler skipped, and name the frame.
                //
                // Build with `-PwithKarma` to reproduce it — add `-PkarmaDir=/path` to test a
                // local metoolkit-karma-decomp checkout — and the default stays a NO_KARMA APK
                // that starts, because an APK without vehicles beats an APK that does not run.
                if (!project.hasProperty('withKarma')) {
                    cmakeArgs += '-DUSE_KARMA_DECOMP=OFF'
                }
                if (sdl2Dir && file(sdl2Dir).isDirectory()) {
                    cmakeArgs += "-DFETCHCONTENT_SOURCE_DIR_SDL2=${sdl2Dir}".toString()
                } else if (sdl2Dir) {
                    logger.warn("sdl2Dir=${sdl2Dir} does not exist — letting FetchContent clone SDL2")
                }
                arguments(*cmakeArgs)
                // OpenAL (openal-soft) is built + packaged but NOT linked into libUT2004 (see
                // SDLLaunch/CMakeLists.txt): ALAudio dlopens libopenal.so at audio-init, after the
                // engine allocator is up. Listed here so AGP builds/packages the standalone target.
                targets 'SDLLaunch', 'ut2004_android_bridge', 'OpenAL'
            }
        }
    }

    // Checkpoint B+: point at the engine's own root CMakeLists (Option B). Its if(ANDROID)
    // branches build the SDLLaunch target as libUT2004.so (whole-archive) alongside libSDL2.so.
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '4.1.2'
        }
    }

    packagingOptions { jniLibs { useLegacyPackaging true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { disable 'ExpiredTargetSdkVersion' }
}
