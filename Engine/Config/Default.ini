[ufront.Shadows]
; Pawn-shadow distance and falloff.
;   CullDistance  the distance at which a shadow is fully faded and past which it stops being drawn at
;                 all: one value with two jobs, the fade curve and `CheckCullDistance`, the actor-level
;                 visibility cull. 1200.0 is retail (the web ships 4800.0).
;   FadeExponent  the shape of the falloff. Retail 2.0 is squared, so a shadow is already 25% faded at
;                 half the cull distance; 1.0 is linear; above 2.0 holds full strength longer and then
;                 drops fast.
; Per launch: the generic override, e.g. -ini:System:[ufront.Shadows]:CullDistance=4800
CullDistance=1200.000000
FadeExponent=2.000000

[ufront.AutoFOV]
; Aspect-correct field of view. UE2 pins the horizontal FOV and derives the vertical one from the
; aspect, so a wide window buys width out of height (90 deg at 4:3 shows 73.7 deg vertically; at
; 24:9 only 41.1). AutoFOV re-derives the horizontal FOV from the live aspect so the vertical one
; stays constant. Applied only while drawing, never written back, so mouse sensitivity (which
; PlayerInput derives from the FOV) is unaffected.
;   AutoFOV         0 = off (stock) - 1 = Hor+ - 2 = Adaptive (default)
;                   Adaptive == Hor+ at or above ReferenceAspect, and stock below it, so a narrow /
;                   half-screen window is never made worse (pure Hor+ at 8:9 would cut both axes).
;   ReferenceAspect the aspect the game was designed for; 1.333333 renders exactly as stock.
;   WeaponScale     viewmodel FOV: 1.0 = correct it like the world (keeps its 4:3 proportions),
;                   0.0 = leave it at the stock DisplayFOV. Blended in tan space.
;   AutoFOVUI       HUD auto-scale: 1 = on (default), 0 = off. Multiplies the game's own global
;                   HudScale by Ref/Aspect, which cancels the width out of the HUD's sizing formula so
;                   widgets size by height instead. Positions are untouched, so corner-anchored widgets
;                   stay in the corners, for any HUD including a total conversion's. Clamped at 1: at or
;                   below ReferenceAspect the factor is exactly 1.0 (narrow/tall windows render as stock).
;   UIScale         extra multiplier on top, for taste. 1.0 = the computed value.
; Per launch: the generic override, e.g. -ini:System:[ufront.AutoFOV]:AutoFOV=0
AutoFOV=2
ReferenceAspect=1.333333
WeaponScale=1.000000
AutoFOVUI=1
UIScale=1.000000
